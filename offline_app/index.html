<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISL Interpreter (Offline)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <style>
        body { background-color: #111827; color: #f3f4f6; font-family: system-ui; overflow: hidden; }
        .video-container { position: relative; width: 100%; height: 60vh; background: #000; border-radius: 12px; overflow: hidden; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .controls { height: 40vh; padding: 15px; overflow-y: auto; }
        .sentence-box { background: #1f2937; min-height: 60px; border-radius: 8px; padding: 10px; font-size: 1.5rem; font-weight: bold; border: 2px solid #374151; word-wrap: break-word; }
        .pred-badge { font-size: 1.2rem; font-weight: bold; color: #22c55e; }
        .btn-action { width: 100%; margin-bottom: 10px; padding: 12px; font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container-fluid p-2">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="m-0 text-success"><i class="bi bi-hand-index-thumb-fill"></i> ISL Offline</h4>
            <span id="statusBadge" class="badge bg-warning text-dark">Loading AI...</span>
        </div>
        
        <div class="video-container shadow-lg">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas"></canvas>
        </div>

        <div class="controls">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="text-secondary small">Detected Sign:</span>
                <span id="predText" class="pred-badge">—</span>
            </div>
            
            <div class="sentence-box text-light mb-3" id="sentenceBox"></div>
            
            <div class="row g-2">
                <div class="col-6">
                    <button id="startBtn" class="btn btn-success btn-action" disabled><i class="bi bi-camera-video"></i> Start</button>
                </div>
                <div class="col-6">
                    <button id="speakBtn" class="btn btn-info btn-action"><i class="bi bi-volume-up"></i> Speak</button>
                </div>
                <div class="col-6">
                    <button id="spaceBtn" class="btn btn-outline-warning btn-action">Space</button>
                </div>
                <div class="col-6">
                    <button id="clearBtn" class="btn btn-outline-danger btn-action">Clear</button>
                </div>
            </div>
            <p class="text-center text-secondary small mt-2 mb-0">Use "Thumbs Up" for Space, "Pinky Up" for Delete.</p>
        </div>
    </div>

    <!-- MediaPipe JS -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("Service Worker Registered for Offline Use"));
        }
    </script>
</body>
</html>
